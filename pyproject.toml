[project]
name = "qcse"
version = "0.1.0"
description = "Qiskit implementation of quantum context-sensitive word embeddings (arXiv:2509.05729v2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["matplotlib>=3.9,<4", "numpy>=2.0,<3", "qiskit>=2.0,<3"]

[project.scripts]
qcse = "qcse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
