[project]
name = "qcse"
version = "0.1.0"
description = "Qiskit implementation of quantum context-sensitive word embeddings (arXiv:2509.05729v2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<3",
    "pyright>=1.1.411",
    "qiskit>=2.0,<3",
    "ruff>=0.16.6",
    "torch>=2.6,<3",
]

[project.scripts]
qcse = "qcse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pyright>=1.1.390", "pytest>=8", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
